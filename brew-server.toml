listen = "0.0.0.0:9000"
websocket_path = "/brew/"
websocket_subprotocol = "brew"
route_without_affiliations = true
fallback_broadcast_when_no_affiliations = true
allow_multiple_calls_per_group = true
higher_priority_number_wins = true
preempt_cause = 1

[tls]
enabled = false
cert_path = "/etc/brew-server/tls/cert.pem"
key_path = "/etc/brew-server/tls/key.pem"

[auth]
enabled = true
realm = "brew-server"
session_ttl_seconds = 300

[auth.users]
"100000001" = "change-me-bs1"
"100000002" = "change-me-bs2"

# Optional: FlowStation's outbound Telemetry channel (BTS -> this server).
# Off by default. See README.md "FlowStation Telemetry" for details.
[telemetry]
enabled = false
listen = "0.0.0.0:9001"

[telemetry.users]
# "100000001" = "change-me-telemetry1"

[telemetry.tls]
enabled = false

# Optional: FlowStation's inbound Control channel (BTS -> this server, commands
# pushed back down the same connection). Off by default. See README.md
# "FlowStation Control" for details.
[control]
enabled = false
listen = "0.0.0.0:9002"

[control.users]
# "100000001" = "change-me-control1"

[control.tls]
enabled = false

# Monitoring dashboard. Now on its OWN listener/port, separate from the Brew
# API. Enabled by default. Set [dashboard.users] to require HTTP Basic auth
# (empty = open). See README.md "Web monitoring dashboard".
[dashboard]
enabled = true
listen = "0.0.0.0:9003"
realm = "brew-server-dashboard"

[dashboard.users]
"admin" = "change-me-dashboard"

[dashboard.tls]
enabled = true
cert_path = "tls/dashboard-cert.pem"
key_path = "tls/dashboard-key.pem"
